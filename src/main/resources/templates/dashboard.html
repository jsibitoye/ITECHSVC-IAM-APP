<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dashboard</title>
    <meta charset="UTF-8">
</head>
<body>
    <!-- title from controller -->
    <h1 th:text="${title}">Dashboard</h1>

    <!-- general dashboard info -->
    <p th:text="${info}">Info goes here</p>

    <hr>

    <!-- show logged-in username -->
    <p>
        Logged-in user:
        <strong th:text="${username}">username</strong>
    </p>

    <!-- show whether Spring sees the user as authenticated -->
    <p>
        Authenticated:
        <strong th:text="${authStatus}">true</strong>
    </p>

    <hr>

    <!-- show all roles that belong to the current user -->
    <p>User roles:</p>
    <ul>
        <li th:each="role : ${roles}" th:text="${role}">ROLE_EMPLOYEE</li>
    </ul>

    <hr>

    <!-- employee-level report: any logged-in user can access -->
    <a href="/reports">Open Employee Report</a>

    <br><br>

    <!-- show admin tools only if the user has ADMIN role -->
    <div sec:authorize="hasRole('ADMIN')">
        <p><strong>Admin tools are visible because you are an admin.</strong></p>
        <a href="/admin">Go to Admin Page</a>

        <br><br>

        <a href="/reports/admin">Open Admin Report</a>
    </div>

    <!-- show this only to non-admins -->
    <div sec:authorize="!hasRole('ADMIN')">
        <p>You are not an admin, so admin links are hidden.</p>
    </div>

    <br><br>

    <a href="/logout">Logout</a>

    <br><br>

    <a href="/">Back Home</a>
</body>
</html>
