<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied</title>
    <meta charset="UTF-8">
</head>
<body>
    <!-- title from controller -->
    <h1 th:text="${title}">Access Denied</h1>

    <!-- friendly explanation -->
    <p th:text="${message}">You do not have permission to access that page.</p>

    <hr>

    <!-- show which user was denied -->
    <p>
        Current user:
        <strong th:text="${username}">username</strong>
    </p>

    <hr>

    <!-- navigation links so user is not stuck -->
    <a href="/dashboard">Back to Dashboard</a>

    <br><br>

    <a href="/">Back Home</a>

    <br><br>

    <a href="/logout">Logout</a>
</body>
</html>
