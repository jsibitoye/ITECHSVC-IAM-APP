# name of your app (not critical for now)
spring.application.name=iTechSVC-iam-app

# server runs on this port
server.port=8080

# enable auto-restart when files change (DevTools)
spring.devtools.restart.enabled=true

# disable HTML caching so changes show immediately
spring.thymeleaf.cache=false

# create a test user (so you don’t depend on random passwords)
spring.security.user.name=employee

# password for the test user
spring.security.user.password=Password123
spring.security.user.roles=EMPLOYEE
