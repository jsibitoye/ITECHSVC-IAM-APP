# name of your app (not critical for now)
spring.application.name=iTechSVC-iam-app

# server runs on this port
server.port=8080

# enable auto-restart when files change (DevTools)
spring.devtools.restart.enabled=true

# disable Thymeleaf Html caching so changes on templates show immediately in browser without restarting app
spring.thymeleaf.cache=false

# create a test user (so you don’t depend on random passwords)
